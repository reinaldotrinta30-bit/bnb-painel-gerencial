name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy rode por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 3. Instalar dependências
        run: npm ci || npm install

      - name: 4. Build Estático Exclusivo para GitHub Pages
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: 5. Garantir arquivo .nojekyll na pasta out
        run: touch ./out/.nojekyll

      - name: 6. Enviar pasta out para o artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 7. Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4